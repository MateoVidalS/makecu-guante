[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -I include -DARDUINOJSON_POOL_CAPACITY=16 -DARDUINOJSON_INITIAL_POOL_COUNT=8 -DARDUINOJSON_AUTO_SHRINK=0
lib_deps = bblanchon/ArduinoJson@7.4.2

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo@1.2.1
    adafruit/Adafruit INA219@1.2.3
    adafruit/Adafruit NeoPixel@1.15.2

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = ${env.build_flags} -Werror
test_build_src = no

[env:native-sanitized]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined -fno-omit-frame-pointer
